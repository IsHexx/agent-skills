<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Skill 目录</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      font-size: 100%; color: #1d1d1f; background: #f5f5f7;
      --ink: #1d1d1f; --muted: #6e6e73; --line: rgba(29,29,31,.09); --surface: rgba(255,255,255,.76);
      --accent: #0071e3; --soft: #e8f2ff; --danger: #c6362c; --warn: #b25000; --ok: #0b7a41;
      --shadow: 0 1.5rem 3.5rem rgba(0,0,0,.10); --radius: 1.15rem;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 20rem; min-height: 100vh; background: radial-gradient(circle at 85% -10%, #dcecff 0, transparent 31rem), #f5f5f7; }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: .18rem solid #2584e8; outline-offset: .15rem; }
    .app { min-height: 100vh; display: grid; grid-template-columns: 16.25rem minmax(0,1fr); }
    .sidebar { position: sticky; top: 0; height: 100vh; padding: 1.25rem .9rem; background: rgba(250,250,252,.74); backdrop-filter: blur(20px) saturate(180%); }
    .brand { padding: .75rem .8rem 1.4rem; }
    .eyebrow { color: var(--accent); font-weight: 700; font-size: .76rem; letter-spacing: .05em; text-transform: uppercase; }
    h1 { margin: .18rem 0 0; font-size: 1.55rem; letter-spacing: -.035em; line-height: 1.08; }
    .nav { display: grid; gap: .25rem; }
    .nav button { border: 0; background: transparent; color: var(--muted); padding: .65rem .8rem; border-radius: .7rem; text-align: left; display: flex; justify-content: space-between; align-items: center; transition: background .18s ease, color .18s ease, transform .1s ease; }
    .nav button:hover, .nav button.active { background: rgba(0,113,227,.1); color: var(--accent); }
    .nav button:active, .button:active, .skill-card:active { transform: scale(.97); transition: transform .1s ease-out; }
    .badge { min-width: 1.35rem; padding: .1rem .38rem; border-radius: 99rem; background: rgba(110,110,115,.12); font-size: .75rem; text-align: center; }
    .sidebar-foot { position: absolute; bottom: 1.35rem; left: 1.7rem; right: 1.7rem; color: var(--muted); font-size: .76rem; line-height: 1.45; }
    main { min-width: 0; padding: 1.15rem clamp(1rem, 3vw, 3rem) 3rem; }
    .topbar { position: sticky; top: 0; z-index: 5; display: grid; grid-template-columns: minmax(12rem, 1fr) auto auto; gap: .7rem; align-items: center; padding: .65rem 0 1rem; background: linear-gradient(to bottom, #f5f5f7 65%, transparent); }
    .search { display: flex; gap: .55rem; align-items: center; padding: .6rem .8rem; background: var(--surface); border: 1px solid var(--line); border-radius: .9rem; box-shadow: 0 .4rem 1rem rgba(0,0,0,.035); }
    .search span { color: var(--muted); }
    .search input { width: 100%; border: 0; outline: 0; color: var(--ink); background: transparent; }
    .select { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: .8rem; padding: .62rem .75rem; }
    .button { border: 0; border-radius: .8rem; padding: .64rem .86rem; font-weight: 650; background: var(--accent); color: #fff; box-shadow: 0 .45rem 1rem rgba(0,113,227,.2); transition: transform .1s ease-out, filter .16s ease; }
    .button:hover { filter: brightness(1.05); }
    .button.secondary { background: var(--surface); color: var(--ink); border: 1px solid var(--line); box-shadow: none; }
    .button[disabled] { opacity: .55; cursor: wait; }
    .health { display: none; margin: .2rem 0 1.15rem; padding: .8rem 1rem; border-radius: .85rem; background: #fff1df; color: #7b3900; line-height: 1.4; }
    .health.show { display: block; }
    .platform-health { display: grid; grid-template-columns: repeat(auto-fit, minmax(12rem, 1fr)); gap: .55rem; margin: .2rem 0 1.15rem; }
    .platform-card { padding: .75rem .85rem; background: var(--surface); border: 1px solid var(--line); border-radius: .85rem; }
    .platform-card strong { display: block; font-size: .88rem; }.platform-card span { display: block; margin-top: .22rem; color: var(--muted); font-size: .76rem; line-height: 1.4; }.platform-card.attention { border-color: #e2a15d; background: #fff8ee; }
    .hero { padding: .75rem 0 1.25rem; display: flex; justify-content: space-between; align-items: end; gap: 1rem; }
    .hero h2 { margin: 0; font-size: clamp(1.55rem, 3vw, 2.45rem); line-height: 1.08; letter-spacing: -.035em; }
    .hero p { margin: .45rem 0 0; color: var(--muted); line-height: 1.45; }
    .stats { display: flex; gap: .55rem; flex-wrap: wrap; }
    .stat { padding: .45rem .65rem; min-width: 4.6rem; background: var(--surface); border: 1px solid var(--line); border-radius: .75rem; }
    .stat strong { display: block; font-size: 1.1rem; letter-spacing: -.02em; }
    .stat span { color: var(--muted); font-size: .72rem; }
    .list { display: grid; grid-template-columns: repeat(auto-fill, minmax(17.5rem, 1fr)); gap: .8rem; }
    .skill-card { width: 100%; min-height: 11.25rem; display: flex; flex-direction: column; align-items: stretch; text-align: left; border: 1px solid var(--line); border-radius: var(--radius); padding: 1rem; color: var(--ink); background: var(--surface); box-shadow: 0 .5rem 1.3rem rgba(0,0,0,.035); transition: transform .1s ease-out, box-shadow .18s ease, border-color .18s ease; }
    .skill-card:hover { border-color: rgba(0,113,227,.35); box-shadow: 0 .9rem 2rem rgba(0,0,0,.07); }
    .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: .7rem; }
    .skill-name { font-size: 1rem; font-weight: 720; letter-spacing: -.012em; overflow-wrap: anywhere; }
    .skill-description { margin: .72rem 0 auto; color: var(--muted); line-height: 1.45; font-size: .86rem; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .chips { margin-top: .9rem; display: flex; gap: .35rem; flex-wrap: wrap; }
    .chip { padding: .17rem .42rem; border-radius: .5rem; font-size: .71rem; line-height: 1.25; background: #ececf0; color: #55555a; }
    .chip.high { background: #dff3e7; color: #176a40; }.chip.low { background: #f1edff; color: #5c45a5; }.chip.observe { background: #fff0d9; color: #8a4b00; }.chip.active { background: #e1f0ff; color: #075da8; }.chip.source-only,.chip.unavailable { background: #f0f0f2; color: #666; }.chip.drift,.chip.conflict { background: #ffe6e3; color: #a53b31; }
    .empty { grid-column: 1 / -1; padding: 3.5rem 1rem; text-align: center; color: var(--muted); background: rgba(255,255,255,.45); border-radius: var(--radius); border: 1px dashed var(--line); }
    .drawer-backdrop { position: fixed; inset: 0; z-index: 20; pointer-events: none; background: rgba(0,0,0,0); transition: background .32s cubic-bezier(.2,.9,.25,1); }
    .drawer-backdrop.open { pointer-events: auto; background: rgba(0,0,0,.16); }
    .drawer { position: fixed; z-index: 21; top: .7rem; right: .7rem; bottom: .7rem; width: min(41rem, calc(100vw - 1.4rem)); display: flex; flex-direction: column; overflow: hidden; border-radius: 1.35rem; background: rgba(255,255,255,.94); color: #1d1d1f; box-shadow: -1.1rem 0 4rem rgba(0,0,0,.16); transform: translateX(calc(100% + 1.5rem)); transition: transform .36s cubic-bezier(.2,.9,.25,1); }
    .drawer.open { transform: translateX(0); }
    .drawer-head { padding: 1.1rem 1.15rem .95rem; display: flex; justify-content: space-between; gap: .7rem; align-items: flex-start; background: rgba(250,250,252,.78); backdrop-filter: blur(20px) saturate(180%); }
    .drawer-title { margin: 0; font-size: 1.3rem; letter-spacing: -.025em; overflow-wrap: anywhere; }.drawer-subtitle { margin: .3rem 0 0; color: #6e6e73; font-size: .86rem; }
    .close { border: 0; width: 2.1rem; height: 2.1rem; border-radius: 99rem; background: #ececf0; color: #333; font-size: 1.25rem; line-height: 1; }
    .drawer-body { overflow: auto; padding: 0 1.15rem 1.4rem; }.detail-meta { display: flex; gap: .35rem; flex-wrap: wrap; padding: 1rem 0; }.detail-description { margin: 0 0 1rem; color: #555; line-height: 1.55; }
    .form { margin: 1rem 0; padding: 1rem; border: 1px solid #e3e3e6; border-radius: 1rem; background: #fafafa; }.form h3 { margin: 0 0 .8rem; font-size: 1rem; }.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: .7rem; }.field { display: grid; gap: .32rem; font-size: .82rem; color: #555; }.field select,.field textarea { width: 100%; border: 1px solid #d5d5da; border-radius: .6rem; padding: .48rem .55rem; color: #1d1d1f; background: #fff; }.field textarea { min-height: 4.3rem; resize: vertical; }.pin { display: flex; align-items: center; gap: .45rem; margin: .75rem 0; color: #555; font-size: .86rem; }.form-actions { display: flex; justify-content: end; }
    .adopt { margin: 1rem 0; padding: 1rem; border-radius: 1rem; background: #f0f7ff; border: 1px solid #cfe6ff; }.adopt h3 { margin: 0; font-size: 1rem; }.adopt p { margin: .48rem 0 .8rem; color: #36536e; line-height: 1.45; font-size: .86rem; }.plan { margin-top: .8rem; padding-top: .8rem; border-top: 1px solid #cfe0ef; }.plan-list { margin: .55rem 0; padding-left: 1.2rem; color: #40586e; font-size: .8rem; line-height: 1.55; max-height: 9rem; overflow: auto; }
    .skill-content { white-space: pre-wrap; overflow-wrap: anywhere; margin: 1rem 0 0; padding: 1rem; border-radius: .85rem; background: #17171a; color: #f5f5f7; font: .77rem/1.55 ui-monospace, SFMono-Regular, Consolas, monospace; }
    .toast-region { position: fixed; z-index: 40; right: 1rem; bottom: 1rem; display: grid; gap: .55rem; width: min(22rem, calc(100vw - 2rem)); }.toast { padding: .8rem .95rem; border-radius: .85rem; color: #fff; background: #333; box-shadow: var(--shadow); animation: toast-in .24s ease-out; }.toast.success { background: #16794b; }.toast.warning { background: #9c5600; }.toast.error { background: #b12d26; }
    @keyframes toast-in { from { opacity: 0; transform: translateY(.8rem); } to { opacity: 1; transform: translateY(0); } }
    @media (max-width: 48rem) { .app { grid-template-columns: 1fr; }.sidebar { height: auto; position: static; padding: .65rem .75rem; background: transparent; backdrop-filter: none; }.brand { display: none; }.nav { display: flex; overflow-x: auto; }.nav button { white-space: nowrap; }.sidebar-foot { display: none; } main { padding-top: .4rem; }.topbar { grid-template-columns: 1fr auto; }.topbar .select { display: none; }.hero { align-items: flex-start; flex-direction: column; }.list { grid-template-columns: 1fr; } }
    @media (prefers-reduced-motion: reduce) { *,*::before,*::after { animation-duration: .01ms !important; transition: opacity .16s ease !important; scroll-behavior: auto !important; }.drawer { transform: none; opacity: 0; pointer-events: none; }.drawer.open { opacity: 1; pointer-events: auto; }.drawer-backdrop.open { background: rgba(0,0,0,.12); } }
    @media (prefers-reduced-transparency: reduce) { .sidebar,.drawer,.topbar,.search,.select,.button.secondary,.skill-card { background: #fff; backdrop-filter: none; } }
    @media (prefers-contrast: more) { .skill-card,.search,.select,.button.secondary { border-color: currentColor; } }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar" aria-label="目录分组">
      <div class="brand"><div class="eyebrow">Local catalog</div><h1>Skill 目录</h1></div>
      <nav class="nav" id="nav"></nav>
      <p class="sidebar-foot">展示个人本地及已配置项目的 Skill；系统内置与插件缓存默认不纳入目录。</p>
    </aside>
    <main>
      <div class="topbar">
        <label class="search"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="搜索名称、描述或标签" autocomplete="off" aria-label="搜索 Skill"></label>
        <select id="status-filter" class="select" aria-label="筛选状态"><option value="all">全部状态</option><option value="active">已启用</option><option value="source-only">仅有原件</option><option value="unavailable">暂不可用</option><option value="drift">内容有差异</option><option value="conflict">内容冲突</option></select>
        <button id="rebuild" class="button" type="button">刷新索引</button>
      </div>
      <section id="health" class="health" role="status"></section>
      <section id="platform-health" class="platform-health" aria-label="跨终端适配状态"></section>
      <section class="hero"><div><h2 id="view-title">全部 Skill</h2><p id="view-subtitle">正在读取本机目录…</p></div><div id="stats" class="stats" aria-label="目录统计"></div></section>
      <section id="list" class="list" aria-live="polite"></section>
    </main>
  </div>
  <div id="backdrop" class="drawer-backdrop" aria-hidden="true"></div>
  <aside id="drawer" class="drawer" aria-hidden="true" aria-label="Skill 详情"><div class="drawer-head"><div><h2 id="drawer-title" class="drawer-title"></h2><p id="drawer-subtitle" class="drawer-subtitle"></p></div><button id="close" class="close" type="button" aria-label="关闭详情">×</button></div><div id="drawer-body" class="drawer-body"></div></aside>
  <div id="toasts" class="toast-region" aria-live="polite" aria-atomic="true"></div>
  <script>
    const state = { data: null, group: 'all', search: '', status: 'all', selected: null };
    const $ = (selector) => document.querySelector(selector);
    const create = (tag, className, text) => { const node = document.createElement(tag); if (className) node.className = className; if (text !== undefined) node.textContent = text; return node; };
    const labels = { all: '全部 Skill', high: '高频', unclassified: '未评级', low: '低频', observe: '观察', eligible: '可直接收编', 'review-required': '需评估', blocked: '保持外部管理', anomalies: '异常' };
    const healthText = { healthy: '目录状态正常', partial: '目录部分可用', error: '目录检查异常', unknown: '目录状态未知' };
    const platformText = { healthy: '可用', 'needs-apply': '待创建链接', conflict: '有同名冲突', 'pending-manual': '待确认入口', unavailable: '目录不可用', misconfigured: '配置错误', unknown: '未检查' };
    function toast(message, type = 'status') { const node = create('div', `toast ${type === 'status' ? '' : type}`, message); $('#toasts').append(node); setTimeout(() => node.remove(), 3800); }
    function chip(text, kind) { return create('span', `chip ${kind || ''}`, text); }
    function matchesGroup(skill) { if (state.group === 'all') return true; if (state.group === 'anomalies') return false; if (['high','low','unclassified'].includes(state.group)) return skill.frequency === state.group && skill.category !== 'observe'; if (state.group === 'observe') return skill.category === 'observe'; if (['eligible','review-required','blocked'].includes(state.group)) return !skill.managed && skill.adoptability === state.group; return true; }
    function matchesFilter(skill) { const query = state.search.trim().toLowerCase(); const bag = [skill.name, skill.description, skill.source_kind, ...(Array.isArray(skill.tags) ? skill.tags : [])].join(' ').toLowerCase(); const statusOk = state.status === 'all' || skill.availability === state.status || skill.integrity === state.status; return matchesGroup(skill) && (!query || bag.includes(query)) && statusOk; }
    function groupCount(group) { if (group === 'anomalies') return (state.data?.anomalies || []).length; return (state.data?.skills || []).filter(skill => { const saved = state.group; state.group = group; const ok = matchesGroup(skill); state.group = saved; return ok; }).length; }
    function renderNav() { const nav = $('#nav'); nav.replaceChildren(); ['all','high','unclassified','low','observe','eligible','review-required','blocked','anomalies'].forEach(group => { const button = create('button', group === state.group ? 'active' : ''); button.type = 'button'; button.dataset.group = group; button.append(create('span', '', labels[group]), create('span', 'badge', String(groupCount(group)))); button.addEventListener('click', () => { state.group = group; render(); }); nav.append(button); }); }
    function renderHealth() { const box = $('#health'); const health = state.data.health || {}; const problematic = !['healthy', undefined].includes(health.status); box.classList.toggle('show', problematic); box.replaceChildren(); if (!problematic) return; box.append(create('strong', '', healthText[health.status] || '目录需要注意')); box.append(document.createTextNode('：' + (health.message || '请刷新索引后再使用结果。'))); }
    function renderPlatformHealth() { const target = $('#platform-health'); target.replaceChildren(); const health = state.data.platform_health || {}; const platforms = Array.isArray(health.platforms) ? health.platforms : []; if (!platforms.length) return; platforms.forEach(platform => { const attention = !['healthy'].includes(platform.status); const card = create('article', `platform-card${attention ? ' attention' : ''}`); const title = platform.platform_id === 'kimi-code' ? 'Kimi Code' : platform.platform_id === 'codex' ? 'Codex' : platform.platform_id; const detail = platform.mode === 'native' ? `原生读取中央目录 · ${health.canonical_skills || 0} 项` : platform.status === 'healthy' ? `已链接 ${platform.linked || 0} 项` : `已链接 ${platform.linked || 0} 项；冲突 ${platform.conflicts || 0} 项`; card.append(create('strong', '', `${title} · ${platformText[platform.status] || platform.status}`), create('span', '', platform.message || detail)); target.append(card); }); }
    function renderStats(skills) { const target = $('#stats'); target.replaceChildren(); const all = state.data.skills || []; const cards = [['总数', all.length], ['已启用', all.filter(s => s.availability === 'active').length], ['未纳管', all.filter(s => !s.managed).length]]; cards.forEach(([label, value]) => { const box = create('div', 'stat'); box.append(create('strong', '', String(value)), create('span', '', label)); target.append(box); }); }
    function renderCard(skill) { const card = create('button', 'skill-card'); card.type = 'button'; card.setAttribute('aria-label', `查看 ${skill.name} 的详情`); const top = create('div', 'card-top'); top.append(create('div', 'skill-name', skill.name)); if (skill.pinned) top.append(chip('置顶', 'active')); card.append(top, create('p', 'skill-description', skill.description || '未提供说明。')); const chips = create('div', 'chips'); if (skill.frequency !== 'unclassified') chips.append(chip(skill.frequency === 'high' ? '高频' : '低频', skill.frequency)); if (skill.category === 'observe') chips.append(chip('观察', 'observe')); chips.append(chip(skill.availability === 'active' ? '已启用' : skill.availability === 'source-only' ? '仅原件' : '暂不可用', skill.availability)); if (skill.integrity !== 'ok') chips.append(chip(skill.integrity === 'drift' ? '内容差异' : '内容冲突', skill.integrity)); if (!skill.managed) chips.append(chip(labels[skill.adoptability] || '未纳管', 'observe')); card.append(chips); card.addEventListener('click', () => openDetail(skill.skill_id, card)); return card; }
    function render() { if (!state.data) return; renderNav(); renderHealth(); renderPlatformHealth(); const current = (state.data.skills || []).filter(matchesFilter).sort((a,b) => Number(Boolean(b.pinned)) - Number(Boolean(a.pinned)) || a.name.localeCompare(b.name)); $('#view-title').textContent = labels[state.group]; $('#view-subtitle').textContent = state.group === 'anomalies' ? '扫描时发现的格式或来源异常。' : `匹配 ${current.length} 项；点击卡片查看完整说明与标签。`; renderStats(current); const list = $('#list'); list.replaceChildren(); if (state.group === 'anomalies') { const anomalies = state.data.anomalies || []; if (!anomalies.length) { list.append(create('div', 'empty', '当前没有异常。')); return; } anomalies.forEach(item => { const node = create('article', 'skill-card'); node.append(create('div', 'skill-name', item.root_id || '扫描异常'), create('p', 'skill-description', item.message || '请刷新索引后重试。')); list.append(node); }); return; } if (!current.length) { list.append(create('div', 'empty', '没有符合当前条件的 Skill。')); return; } current.forEach(skill => list.append(renderCard(skill))); }
    function closeDetail() { $('#drawer').classList.remove('open'); $('#backdrop').classList.remove('open'); $('#drawer').setAttribute('aria-hidden','true'); state.selected?.focus(); }
    async function openDetail(skillId, trigger) { state.selected = trigger; const drawer = $('#drawer'); $('#drawer-title').textContent = '正在加载…'; $('#drawer-subtitle').textContent = ''; $('#drawer-body').replaceChildren(); drawer.classList.add('open'); $('#backdrop').classList.add('open'); drawer.setAttribute('aria-hidden','false'); $('#close').focus(); try { const response = await fetch(`/api/skill?id=${encodeURIComponent(skillId)}`, { cache: 'no-store' }); const detail = await response.json(); if (!response.ok) throw new Error(detail.error || '无法读取详情。'); renderDetail(detail); } catch (error) { $('#drawer-title').textContent = '无法读取详情'; $('#drawer-body').append(create('p','detail-description', error.message)); toast(error.message, 'error'); } }
    function renderDetail(detail) { $('#drawer-title').textContent = detail.name; $('#drawer-subtitle').textContent = detail.description || ''; const body = $('#drawer-body'); body.replaceChildren(); const meta = create('div','detail-meta'); meta.append(chip(detail.availability === 'active' ? '已启用' : detail.availability, detail.availability), chip(detail.integrity === 'ok' ? '内容正常' : detail.integrity, detail.integrity), chip(detail.source_kind, '')); body.append(meta); const form = create('form','form'); form.noValidate = true; form.append(create('h3','', '个人标签')); const fields = create('div','form-grid'); const frequency = create('select'); [['high','高频'],['unclassified','未评级'],['low','低频']].forEach(([value,text]) => { const option = create('option','',text); option.value = value; option.selected = detail.frequency === value; frequency.append(option); }); const category = create('select'); (state.data.allowed_categories || ['general','observe']).forEach(value => { const option = create('option','', value === 'observe' ? '观察' : '常规'); option.value = value; option.selected = detail.category === value; category.append(option); }); const note = create('textarea'); note.maxLength = 500; note.value = detail.note || ''; fields.append(field('使用频率',frequency), field('分类',category)); form.append(fields); form.append(field('备注',note)); const pinLine = create('label','pin'); const pin = document.createElement('input'); pin.type = 'checkbox'; pin.checked = Boolean(detail.pinned); pinLine.append(pin, document.createTextNode('置顶展示')); form.append(pinLine); const actions = create('div','form-actions'); const save = create('button','button','保存标签'); save.type='submit'; actions.append(save); form.append(actions); form.addEventListener('submit', async event => { event.preventDefault(); save.disabled = true; try { await saveOverride({ skill_id: detail.skill_id, frequency: frequency.value, category: category.value, tags: Array.isArray(detail.tags) ? detail.tags : [], note: note.value, pinned: pin.checked }); toast('标签已保存。','success'); await loadCatalog(); } catch (error) { toast(error.message,'error'); } finally { save.disabled=false; } }); body.append(form); if (detail.adoptability === 'eligible') body.append(renderAdoption(detail)); body.append(create('h3','', 'SKILL.md')); const content = create('pre','skill-content'); content.textContent = detail.content || '当前来源不可读取完整内容。'; body.append(content); }
    function field(label, input) { const wrapper = create('label','field'); wrapper.append(create('span','',label), input); return wrapper; }
    function renderAdoption(detail) { const section = create('section','adopt'); section.append(create('h3','', '收编到 Hub'), create('p','', '仅有明确本地自建证据的 Skill 可收编。先生成只读预检清单，确认后才会复制、备份并切换入口。')); const planButton = create('button','button secondary','生成收编预检'); planButton.type = 'button'; const preview = create('div','plan'); preview.hidden = true; section.append(planButton, preview); planButton.addEventListener('click', async () => { planButton.disabled = true; try { const plan = await requestAdoptionPlan(detail.skill_id); renderPlanPreview(plan, preview); preview.hidden = false; toast('收编预检已生成，请核对清单。','success'); } catch (error) { toast(error.message,'error'); } finally { planButton.disabled = false; } }); return section; }
    function renderPlanPreview(plan, preview) { preview.replaceChildren(); const summary = create('p','', `计划有效至 ${new Date(plan.expires_at).toLocaleString()}；将复制 ${plan.copy_manifest.length} 个文件。`); preview.append(summary); const list = create('ul','plan-list'); plan.copy_manifest.forEach(item => list.append(create('li','', `${item.path}（${item.bytes} bytes）`))); preview.append(list); if (plan.risk_findings.length) { const warning = create('p','', `注意：发现 ${plan.risk_findings.length} 项需确认内容。`); preview.append(warning); } const confirm = create('button','button','确认收编'); confirm.type = 'button'; confirm.addEventListener('click', async () => { const accepted = window.confirm(`确认将 ${plan.logical_name} 收编到 Hub 吗？原安装目录会先移动到本机备份，再建立入口链接。`); if (!accepted) return; confirm.disabled = true; try { const result = await requestAdoptionCommit(plan); toast(`${result.logical_name || 'Skill'} 已完成收编。`, 'success'); closeDetail(); await loadCatalog(); } catch (error) { toast(error.message,'error'); } finally { confirm.disabled = false; } }); preview.append(confirm); }
    async function requestAdoptionPlan(skillId) { const response = await fetch('/api/adopt/plan', { method: 'POST', headers: { 'Content-Type':'application/json', 'X-CSRF-Token': state.data.csrf_token }, body: JSON.stringify({ skill_id: skillId }) }); const result = await response.json(); if (!response.ok) throw new Error(result.error || '收编预检失败。'); return result.plan; }
    async function requestAdoptionCommit(plan) { const response = await fetch('/api/adopt/commit', { method: 'POST', headers: { 'Content-Type':'application/json', 'X-CSRF-Token': state.data.csrf_token }, body: JSON.stringify({ plan_id: plan.plan_id, skill_id: plan.skill_id, expected_content_hash: plan.expected_content_hash }) }); const result = await response.json(); if (!response.ok) throw new Error(result.error || '收编提交失败。'); return result.committed; }
    async function saveOverride(payload) { const response = await fetch('/api/overrides', { method: 'POST', headers: { 'Content-Type':'application/json', 'X-CSRF-Token': state.data.csrf_token }, body: JSON.stringify(payload) }); const result = await response.json(); if (!response.ok) throw new Error(result.error || '保存失败。'); return result; }
    async function loadCatalog() { const response = await fetch('/api/catalog', { cache: 'no-store' }); const data = await response.json(); if (!response.ok) throw new Error(data.error || '无法读取目录。'); state.data = data; render(); }
    async function rebuild() { const button = $('#rebuild'); button.disabled = true; button.textContent = '刷新中…'; try { const response = await fetch('/api/rebuild', { method: 'POST', headers: { 'Content-Type':'application/json', 'X-CSRF-Token': state.data.csrf_token }, body: '{}' }); const result = await response.json(); if (!response.ok) throw new Error(result.error || '刷新失败。'); await loadCatalog(); toast(`索引已刷新：${result.rebuilt.after_count} 个 Skill。`, 'success'); } catch (error) { toast(error.message, 'error'); } finally { button.disabled = false; button.textContent = '刷新索引'; } }
    $('#search').addEventListener('input', event => { state.search = event.target.value; render(); }); $('#status-filter').addEventListener('change', event => { state.status = event.target.value; render(); }); $('#rebuild').addEventListener('click', rebuild); $('#close').addEventListener('click', closeDetail); $('#backdrop').addEventListener('click', closeDetail); document.addEventListener('keydown', event => { if (event.key === 'Escape' && $('#drawer').classList.contains('open')) closeDetail(); });
    loadCatalog().catch(error => { $('#view-subtitle').textContent = error.message; toast(error.message, 'error'); });
  </script>
</body>
</html>
